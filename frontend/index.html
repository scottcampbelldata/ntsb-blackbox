    <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Black Box","url":"https://blackbox.scottcampbell.io/","description":"Explore 7,462 NTSB aviation accident final reports. Every figure is a live SQL query you can inspect.","applicationCategory":"ReferenceApplication","operatingSystem":"Any (web browser)","isAccessibleForFree":true,"author":{"@type":"Person","name":"Scott Campbell","url":"https://scottcampbell.io/"},"subjectOf":{"@type":"CreativeWork","url":"https://scottcampbell.io/projects/black-box-ai/"},"sameAs":["https://github.com/scottcampbelldata/ntsb-blackbox"]}</script>
    <!-- Resolve the theme before first paint so there is no flash. The app's
         ThemeProvider owns the value afterward; this only mirrors its logic. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("blackbox-theme");
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = saved === "light" || saved === "dark" ? saved : systemDark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
